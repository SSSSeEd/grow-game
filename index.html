<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GROW - prototype</title>
<style>
:root{--ink:#29352e;--muted:#6d7a70;--green:#4e865d;--pale:#edf4e9;--cream:#fbf8ef;--line:#dce5d8;--gold:#e7bd68}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf2e5,#f8f4e9);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(920px,100%);background:#fffdf7;border:1px solid #dce5d8;border-radius:24px;box-shadow:0 18px 55px #30442b1c;overflow:hidden}.top{padding:20px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}.brand{font-weight:850;letter-spacing:.12em;color:#477752}.tag{font-size:12px;color:var(--muted);background:var(--pale);padding:7px 11px;border-radius:99px}.main{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;padding:24px}.scene{background:linear-gradient(#e8f3f2 0 55%,#e8e5c9 55%);transition:background 1s ease;border:1px solid var(--line);border-radius:20px;min-height:340px;position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.sun{position:absolute;right:35px;top:28px;width:48px;height:48px;border-radius:50%;background:#f5cf78;box-shadow:0 0 0 12px #f5cf782b}.cloud{position:absolute;left:30px;top:45px;font-size:35px;opacity:.55;transition:opacity .8s,transform 1s}.time-orb{position:absolute;right:35px;top:25px;z-index:1;font-size:43px;line-height:1;filter:drop-shadow(0 3px 5px #53614325);transition:transform .8s,opacity .8s;animation:orbFloat 3s ease-in-out infinite}.sun{transition:opacity .8s,transform .8s}.scene.time-morning{background:linear-gradient(#f8e9c9 0%,#eaf3e6 55%,#e8e5c9 55%)}.scene.time-noon{background:linear-gradient(#a9d9ed 0%,#e2f3ee 55%,#e8e5c9 55%)}.scene.time-night{background:linear-gradient(#263b60 0%,#617b9a 55%,#b2b18b 55%)}.scene.time-night .cloud{opacity:.2;filter:grayscale(1)}.scene.time-night .sun{opacity:0;transform:translateY(-12px)}.scene.time-night .ground{background:linear-gradient(#8e9d75,#718a67)}.scene.time-night .scene-caption{background:#f7f4e8d9;color:#394b43}.scene.time-night .stage-label{background:#f7f4e8e8}.scene.time-morning .sun{background:#f6b65e;box-shadow:0 0 0 14px #f6b65e2b}.scene.time-noon .sun{background:#ffe17b;box-shadow:0 0 0 17px #ffe17b38;transform:scale(1.12)}@keyframes orbFloat{0%,100%{translate:0 0}50%{translate:0 -5px}}.ground{position:absolute;bottom:0;height:40%;width:100%;background:linear-gradient(#b5c78b,#93af70);border-radius:50% 50% 0 0/15% 15% 0 0}.pot{position:absolute;bottom:35px;width:150px;height:104px;background:#c98259;clip-path:polygon(8% 0,92% 0,78% 100%,22% 100%);z-index:2;filter:drop-shadow(0 7px 3px #52614322)}.soil{position:absolute;bottom:128px;width:124px;height:20px;border-radius:50%;background:#77533b;z-index:3}.plant{position:absolute;bottom:139px;width:150px;height:180px;z-index:4;display:flex;justify-content:center;align-items:flex-end}.stem{position:absolute;bottom:0;width:9px;height:var(--growth,42px);background:#478653;border-radius:9px;transition:height .5s}.leaf{position:absolute;width:54px;height:27px;background:#66a96a;border-radius:100% 0 100% 0;transform:rotate(-28deg);bottom:var(--leafY,35px);left:25px;opacity:var(--leafOpacity,.9);transition:all .4s}.leaf.r{left:auto;right:25px;transform:scaleX(-1) rotate(-28deg);bottom:calc(var(--leafY,35px) + 20px)}.flower{position:absolute;bottom:var(--flowerY,70px);font-size:0;transition:all .4s}.flower.show{font-size:56px}.stage-label{position:absolute;top:14px;left:15px;background:#ffffffc9;border:1px solid #ffffff;border-radius:99px;padding:7px 11px;font-size:12px;color:#536658;z-index:5}.scene-caption{position:absolute;bottom:12px;z-index:6;font-size:12px;color:#4f624d;background:#ffffffb8;padding:5px 10px;border-radius:99px}.action-props{position:absolute;inset:0;z-index:5;pointer-events:none}.prop{position:absolute;left:9%;bottom:75px;font-size:48px;opacity:0;transform:translateY(12px) scale(.8);transition:opacity .25s,transform .25s;filter:drop-shadow(0 4px 2px #33443322)}.prop.visible{opacity:1;transform:translateY(0) scale(1)}.prop.fertilizer{left:10%;font-size:43px}.gardener{position:absolute;right:8%;bottom:65px;font-size:58px;opacity:0;transform:translateX(16px);transition:opacity .2s,transform .2s;filter:drop-shadow(0 4px 2px #33443322)}.gardener.visible{opacity:1;transform:translateX(0)}.water-stream{position:absolute;left:29%;bottom:160px;width:100px;height:90px;opacity:0;transform:rotate(25deg);transform-origin:top left}.water-stream:before{content:'💧 💧 💧';font-size:23px;letter-spacing:3px;display:block;animation:drip .55s ease-in-out infinite alternate}.scene.anim-water .water-stream{opacity:1}.scene.anim-water .prop.water{animation:canTilt .85s ease-in-out 2}.scene.anim-fertilizer .prop.fertilizer{animation:shake .5s ease-in-out 3}.scene.anim-fertilizer:after{content:'✦  ✧  ✦';position:absolute;left:25%;bottom:155px;color:#e6b94e;font-size:27px;animation:sparkle .9s ease-out}.scene.anim-soil .soil{animation:soilPop .6s ease-out}.scene.anim-prep .prop{animation:pop .45s ease-out}@keyframes drip{from{transform:translateY(-2px);opacity:.55}to{transform:translateY(18px);opacity:1}}@keyframes canTilt{0%,100%{transform:rotate(0)}45%{transform:rotate(-24deg) translateY(-5px)}}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}@keyframes sparkle{0%{opacity:0;transform:translateY(-12px)}35%{opacity:1}100%{opacity:0;transform:translateY(16px)}}@keyframes soilPop{0%{transform:scaleX(.7);opacity:.5}100%{transform:scaleX(1);opacity:1}}@keyframes pop{0%{transform:translateY(12px) scale(.65)}75%{transform:translateY(-4px) scale(1.08)}100%{transform:translateY(0) scale(1)}}.panel{display:flex;flex-direction:column;gap:15px}.dayrow{display:flex;justify-content:space-between;align-items:center}.day{font-size:13px;color:var(--muted)}.time{font-size:14px;font-weight:750;background:var(--pale);padding:8px 12px;border-radius:10px}.progress{display:flex;gap:5px}.pip{height:6px;flex:1;border-radius:8px;background:#e5e9df}.pip.done{background:#73a47b}.section-title{font-weight:800;font-size:16px}.hint{font-size:13px;color:var(--muted);line-height:1.6}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{border:1.5px solid var(--line);border-radius:15px;background:#fff;padding:12px 10px;text-align:left;cursor:pointer;transition:.15s;color:var(--ink);min-height:92px}.choice:hover{border-color:#75a77b;transform:translateY(-2px);background:#fbfef9}.choice:disabled{opacity:.42;cursor:not-allowed;transform:none}.emoji{font-size:26px;display:block;margin-bottom:4px}.choice b{font-size:14px}.choice small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.log{background:#f5f7ef;border-radius:13px;padding:12px;font-size:12px;line-height:1.55;color:#5e6c5f;min-height:66px}.buttons{display:flex;gap:8px}.secondary{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 13px;color:var(--muted);cursor:pointer}.primary{border:0;background:var(--green);color:white;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:700}.bottom{border-top:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:11px}.overlay{position:absolute;inset:0;background:#233629aa;z-index:10;display:none;place-items:center;padding:20px}.overlay.show{display:grid}.modal{background:#fffdf7;border-radius:20px;padding:25px;text-align:center;max-width:350px;width:100%;box-shadow:0 15px 40px #0003}.modal h2{margin:5px 0 8px}.modal p{color:var(--muted);font-size:14px;line-height:1.6}.modal .big{font-size:50px}@media(max-width:680px){.main{grid-template-columns:1fr;padding:15px}.scene{min-height:280px}.top{padding:16px}.bottom{padding:12px 16px}.panel{gap:11px}}
</style></head><body><div class="app"><header class="top"><div class="brand">GROW <span style="font-weight:400;color:#8a9a8a;letter-spacing:0">/ mini prototype</span></div><div class="tag">プレゼン用イメージデモ</div></header><main class="main"><section class="scene" aria-label="植物の成長画面"><div class="sun"></div><div class="time-orb" id="timeOrb" aria-hidden="true">🌅</div><div class="cloud">☁</div><div class="stage-label" id="stage">小さな芽</div><div class="ground"></div><div class="pot"></div><div class="soil"></div><div class="plant" id="plant"><div class="stem" id="stem"></div><div class="leaf" id="leafL"></div><div class="leaf r" id="leafR"></div><div class="flower" id="flower">🌼</div></div><div class="action-props"><div class="prop water" id="waterProp">🚿</div><div class="prop fertilizer" id="fertilizerProp">🪴</div><div class="gardener" id="gardener">🧑‍🌾</div><div class="water-stream"></div></div><div class="scene-caption" id="sceneCaption">植物の様子を見守ろう</div></section><section class="panel"><div class="dayrow"><div><div class="day" id="day">1日目</div><div class="section-title">植物を育てよう</div></div><div class="time" id="time">☀ 朝</div></div><div class="progress" id="progress"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div><div class="section-title">次の行動を選択</div><div class="hint">道具を用意してから「人間」を選ぶと使用します。土のように、選ぶだけで効果が出るものもあります。</div><div class="choices"><button class="choice" data-choice="human"><span class="emoji">🧑‍🌾</span><b>人間</b><small>準備した道具を使う</small></button><button class="choice" data-choice="water"><span class="emoji">🚿</span><b>水</b><small>じょうろを用意する</small></button><button class="choice" data-choice="fertilizer"><span class="emoji">🪴</span><b>肥料</b><small>肥料を用意する</small></button><button class="choice" data-choice="soil"><span class="emoji">🟫</span><b>土</b><small>その場で環境を整える</small></button></div><div class="log" id="log" aria-live="polite">最初の行動を選んでみよう。全6行動で植物の結末が変わります。</div><div class="buttons"><button class="secondary" id="reset">最初から</button><button class="primary" id="help">ルールを見る</button></div></section></main><footer class="bottom"><span>操作：選択肢をクリックして進行（全6行動）</span><span>※ルール・演出は検討用の仮仕様</span></footer><div class="overlay" id="overlay"><div class="modal"><div class="big" id="endEmoji">🌸</div><h2 id="endTitle">結果</h2><p id="endText"></p><button class="primary" id="again">もう一度遊ぶ</button></div></div></div>
<script>
const names={human:'人間',water:'水',fertilizer:'肥料',soil:'土'};let state;
function fresh(){state={turn:0,tools:[],soil:false,water:0,fed:false,growth:0,log:'最初の行動を選んでみよう。全6行動で植物の結末が変わります。',events:[]};render()}
function current(){return ['朝','昼','夜'][state.turn%3]}
function animate(kind){const scene=document.querySelector('.scene');scene.classList.remove('anim-water','anim-fertilizer','anim-soil','anim-prep');void scene.offsetWidth;if(kind)scene.classList.add(kind);if(kind==='anim-water'||kind==='anim-fertilizer')document.getElementById('gardener').classList.add('visible');setTimeout(()=>{scene.classList.remove('anim-water','anim-fertilizer','anim-soil','anim-prep');},1900)}
function act(c){if(state.turn>=6)return;let msg='',animation='';if(c==='soil'){animation='anim-soil';if(!state.soil){state.soil=true;msg='土が植物の周りに配置された。根を張る準備ができた！'}else msg='土はすでに整っている。';}
else if(c==='water'){state.tools.push('water');animation='anim-prep';msg='じょうろが用意された。人間を選ぶと水やりができる。'}
else if(c==='fertilizer'){state.tools.push('fertilizer');animation='anim-prep';msg='肥料が用意された。人間を選ぶと肥料を与えられる。'}
else{if(!state.tools.length){msg='使える道具がない。人間は周囲を見回している……'}else{let tool=state.tools.shift();if(tool==='water'){animation='anim-water';if(current()==='昼'){state.water+=0.35;msg='昼に水を与えた。暑さで水分が失われやすい……'}else{state.water+=1;msg='人間がじょうろで水を与えた！'}}else{animation='anim-fertilizer';if(state.growth>1){msg='成長が進んでからの肥料は遅かったようだ……'}else{state.fed=true;msg='人間が肥料を与えた。成長の助けになりそう！'}}}}
state.events.push({c,turn:state.turn,time:current(),msg});state.turn++;state.log=msg;if(state.turn===6)setTimeout(ending,180);render();animate(animation)}
function render(){const period=state.turn>=6?'night':['morning','noon','night'][state.turn%3];const scene=document.querySelector('.scene');scene.classList.remove('time-morning','time-noon','time-night');scene.classList.add('time-'+period);document.getElementById('timeOrb').textContent=period==='morning'?'🌅':period==='noon'?'☀️':'🌙';document.getElementById('day').textContent=(state.turn<3?'1日目':'2日目');document.getElementById('time').textContent=['☀ 朝','🌤 昼','🌙 夜'][state.turn%3]||'🌙 夜';document.getElementById('progress').innerHTML=Array.from({length:6},(_,i)=>`<i class="pip ${i<state.turn?'done':''}"></i>`).join('');document.querySelectorAll('.choice').forEach(b=>b.disabled=state.turn>=6);document.getElementById('log').textContent=state.log;document.getElementById('waterProp').classList.toggle('visible',state.tools.includes('water'));document.getElementById('fertilizerProp').classList.toggle('visible',state.tools.includes('fertilizer'));document.getElementById('gardener').classList.toggle('visible',state.events.some(e=>e.c==='human'));let waterGood=state.water>=1;state.growth=(state.soil?0.6:0)+(state.fed?0.7:0)+(waterGood?1:state.water>0?.25:0);let stage=state.growth>=2.1?'つぼみ':state.growth>=1.1?'葉が育ってきた':state.growth>=.5?'小さな芽':'種';document.getElementById('stage').textContent=stage;let h=35+state.growth*47;document.getElementById('stem').style.setProperty('--growth',h+'px');let leafY=18+state.growth*25;document.getElementById('leafL').style.setProperty('--leafY',leafY+'px');document.getElementById('leafR').style.setProperty('--leafY',leafY+'px');document.getElementById('leafL').style.opacity=state.growth>.4?1:0;document.getElementById('leafR').style.opacity=state.growth>1?1:0;let bloom=state.turn>=6&&state.soil&&state.fed&&waterGood&&state.events.findIndex(e=>e.c==='fertilizer')<state.events.findIndex(e=>e.c==='human'&&e.msg.includes('肥料'));document.getElementById('flower').className='flower'+(bloom?' show':'');document.getElementById('sceneCaption').textContent=state.turn===0?'植物の様子を見守ろう':state.turn>=6?'育った植物の結末':'行動 '+state.turn+' / 6'}
function ending(){let hasWater=state.water>=1, fedInTime=state.fed&&state.events.findIndex(e=>e.c==='fertilizer')<state.events.findIndex(e=>e.c==='human'&&e.msg.includes('肥料'));let success=state.soil&&hasWater&&fedInTime;document.getElementById('endEmoji').textContent=success?'🌸':'🌱';document.getElementById('endTitle').textContent=success?'花が咲いた！':'まだ成長の途中…';document.getElementById('endText').textContent=success?'土・肥料・水を適切に組み合わせ、植物を育てることができた。':'必要な準備やタイミングが足りなかったようだ。選択の順番を変えて、もう一度試してみよう。';document.getElementById('overlay').classList.add('show')}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>act(b.dataset.choice)));document.getElementById('reset').onclick=fresh;document.getElementById('again').onclick=()=>{document.getElementById('overlay').classList.remove('show');fresh()};document.getElementById('help').onclick=()=>{document.getElementById('endEmoji').textContent='🧩';document.getElementById('endTitle').textContent='デモのルール';document.getElementById('endText').textContent='全6回の行動で植物を育てます。水・肥料を選ぶと道具が出現し、人間を選ぶと道具を1つ使用します。土は選ぶだけで配置されます。肥料は成長前、水やりは昼以外が扱いやすい想定です。これはプレゼン用の仮ルールです。';document.getElementById('overlay').classList.add('show')};fresh();
</script></body></html>
